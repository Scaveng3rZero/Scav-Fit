<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#121826" />
  <title>My Fitness Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-effects" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grid-glow"></span>
  </div>

  <div class="app">
    <header class="site-header">
      <div class="header-top">
        <div>
          <h1>My Fitness Tracker</h1>
          <p class="subtitle">Bodyweight ACFT + Mobility + Strength Plan</p>
        </div>

        <div class="header-stats">
          <div class="stat-pill">
            <span class="stat-label">Today</span>
            <span id="todayLabel" class="stat-value">--</span>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Streak</span>
            <span id="streakValue" class="stat-value">0 days</span>
          </div>
        </div>
      </div>
    </header>

    <main id="app"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
